<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Меню клиента</title>
<meta name="theme-color" content="#2f7a4f">

<!-- Favicon -->
<link rel="icon" href="icons/mysite.ico">
<link rel="icon" type="image/png" sizes="16x16" href="icons/mysite-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/mysite-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/mysite-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/mysite-512x512.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/mysite-180x180.png">

<!-- PWA & Mobile -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Меню">

<!-- Styles -->
<link rel="stylesheet" href="shared/css/main.css">
<link rel="stylesheet" href="shared/css/search.css">
</head>
<body>

<a class="skip-link" href="#content">Перейти к содержимому</a>

<!-- Нижняя панель для мобильных устройств: навигация по дням, поиск-триггер, тема -->
<div id="mobile-topbar">
  <button id="menu-toggle" aria-label="Открыть меню дней" aria-expanded="false" aria-controls="sidebar"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button id="day-prev" class="day-nav-btn" aria-label="Предыдущий день"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <span id="mobile-current-day" aria-live="polite">Меню</span>
  <button id="day-next" class="day-nav-btn" aria-label="Следующий день"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Переключить тему"><svg class="icon theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button>
</div>

<!-- Оверлей при открытом мобильном меню -->
<div id="sidebar-overlay"></div>

<nav id="sidebar" aria-label="Навигация по дням меню">
  <h1>Меню <button class="theme-toggle-btn" id="theme-toggle-desktop" aria-label="Переключить тему"><svg class="icon theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button></h1>
  <label for="search-box" style="position:absolute;left:-9999px;">Поиск по дню, блюду или ингредиенту</label>
  <div class="search-control">
    <input type="search" id="search-box" placeholder="Блюдо или ингредиент..." autocomplete="off" enterkeyhint="search" aria-controls="search-results">
    <button id="search-clear" type="button" aria-label="Очистить поиск" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
  </div>
  <div id="search-status" role="status" aria-live="polite"></div>
  <div id="search-results" role="region" aria-label="Результаты поиска" hidden></div>
  <div id="nav-links"></div>
  <div id="no-results" role="status" hidden>Ничего не найдено</div>
</nav>

<div id="content">
  <div id="top-header">
    <h1>Меню клиента</h1>
    <p>Полное меню · Завтрак, обед, ужин и перекус для каждого дня</p>
  </div>

<div id="today-banner" aria-live="polite"></div>

<div id="days-end" aria-hidden="true" style="height:60vh;"></div>



</div>

<div id="swipe-toast" aria-hidden="true"></div>
<button id="back-to-top" title="Наверх" aria-label="Наверх страницы"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5"/></svg></button>

<noscript><p style="padding:16px">Для работы меню нужен включённый JavaScript.</p></noscript>
<script type="module" src="shared/js/app.js"></script>
</body>
</html>
